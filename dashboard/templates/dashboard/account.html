{% extends "dashboard/base_dashboard.html" %}


{% block title %}
My Profile
{% endblock %}



{% block content %}


<div class="container">


<div class="card shadow border-0 rounded-4">


<div class="card-body p-4">


<h3 class="fw-bold mb-4">
My Profile
</h3>



<form method="POST">

{% csrf_token %}



<div class="mb-3">

<label class="form-label">
Username
</label>

<input 
type="text"
name="username"
class="form-control"
value="{{ request.user.username }}"
required>

</div>




<div class="mb-3">

<label class="form-label">
First Name
</label>

<input 
type="text"
name="first_name"
class="form-control"
value="{{ request.user.first_name }}">

</div>





<div class="mb-3">

<label class="form-label">
Email
</label>

<input 
type="email"
name="email"
class="form-control"
value="{{ request.user.email }}">

</div>




<button class="btn btn-dark">

Save Changes

</button>



<a href="{% url 'dashboard:change_password' %}" 
class="btn btn-outline-dark ms-2">

Change Password

</a>



<a href="{% url 'dashboard:logout' %}" 
class="btn btn-danger ms-2">

Logout

</a>



</form>



</div>


</div>


</div>


{% endblock %}
