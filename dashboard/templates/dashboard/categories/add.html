{% extends "dashboard/base_dashboard.html" %}


{% block title %}
Add Category
{% endblock %}



{% block content %}


<div class="card shadow border-0 rounded-4">


<div class="card-body p-4">


<h3 class="fw-bold mb-4">

Add Category

</h3>



<form method="POST"
enctype="multipart/form-data">


{% csrf_token %}



<div class="mb-3">

<label class="form-label">

Category Name

</label>


<input 
type="text"
name="name"
class="form-control"
required>


</div>




<div class="mb-3">

<label class="form-label">

Icon Class

</label>


<input 
type="text"
name="icon_class"
class="form-control"
placeholder="bi-cup-hot">


</div>




<div class="mb-3">

<label class="form-label">

Category Image

</label>


<input 
type="file"
name="image"
class="form-control">


</div>




<button class="btn btn-dark">

Save Category

</button>



<a href="{% url 'dashboard:categories' %}"
class="btn btn-outline-dark">

Back

</a>



</form>


</div>


</div>


{% endblock %}
