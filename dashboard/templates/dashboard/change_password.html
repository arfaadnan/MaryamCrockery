{% extends "dashboard/base_dashboard.html" %}


{% block title %}
Change Password
{% endblock %}



{% block content %}


<div class="container">


<div class="card shadow border-0 rounded-4">


<div class="card-body p-4">


<h3 class="fw-bold mb-4">
Change Password
</h3>



<form method="POST">

{% csrf_token %}



<div class="mb-3">

<label class="form-label">
Current Password
</label>

{{ form.old_password }}

</div>




<div class="mb-3">

<label class="form-label">
New Password
</label>

{{ form.new_password1 }}

</div>




<div class="mb-3">

<label class="form-label">
Confirm New Password
</label>

{{ form.new_password2 }}

</div>




<button type="submit" class="btn btn-dark">

Update Password

</button>



<a href="{% url 'dashboard:account' %}" 
class="btn btn-outline-dark ms-2">

Back

</a>



</form>



</div>


</div>


</div>



{% endblock %}
