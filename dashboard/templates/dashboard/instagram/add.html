{% extends "dashboard/base_dashboard.html" %}



{% block title %}
Add Instagram Post
{% endblock %}




{% block content %}



<div class="container-fluid">



<div class="card shadow border-0 rounded-4">



<div class="card-body p-4">



<!-- ========================= -->
<!-- ADD INSTAGRAM POST -->
<!-- ========================= -->


<h3 class="fw-bold mb-4">

Add Instagram Post

</h3>




<form method="POST" enctype="multipart/form-data">


{% csrf_token %}




<label class="mb-2">

Image

</label>


<input
type="file"
name="image"
class="form-control mb-3"
required>





<label class="mb-2">

Caption

</label>


<textarea
name="caption"
class="form-control mb-3"></textarea>





<label class="mb-2">

Instagram Link

</label>


<input
type="url"
name="link"
class="form-control mb-4">





<button class="btn btn-primary">

Save Post

</button>




<a href="{% url 'dashboard:instagram' %}"
class="btn btn-secondary">

Cancel

</a>




</form>




</div>


</div>


</div>



{% endblock %}
