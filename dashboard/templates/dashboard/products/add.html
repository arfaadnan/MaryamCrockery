{% extends "dashboard/base_dashboard.html" %}


{% block title %}
Add Product
{% endblock %}



{% block content %}


<div class="container-fluid">


<div class="card shadow border-0 rounded-4">


<div class="card-body p-4">


<div class="d-flex justify-content-between align-items-center mb-4">

<h3 class="fw-bold">
Add New Product
</h3>


<a href="{% url 'dashboard:products' %}"
class="btn btn-outline-dark">

Back

</a>


</div>



<form method="POST" enctype="multipart/form-data">
    

{% csrf_token %}



<div class="row">



<div class="col-md-6 mb-3">

<label class="form-label">
Product Name
</label>

<input 
type="text"
name="name"
class="form-control"
required>

</div>



<div class="col-md-6 mb-3">

<label class="form-label">
SKU
</label>

<input 
type="text"
name="sku"
class="form-control"
required>

</div>





<div class="col-md-6 mb-3">

<label class="form-label">
Category
</label>


<select 
name="category"
id="category"
class="form-select">
required>


<option value="">
Select Category
</option>


{% for category in categories %}

<option value="{{ category.id }}">

{{ category.name }}

</option>


{% endfor %}


</select>


</div>






<div class="col-md-6 mb-3">

<label class="form-label">

Sub Category

</label>


<select 
name="subcategory"
id="subcategory"
class="form-select">


<option value="">

Select Sub Category

</option>


</select>

</div>







<div class="col-md-4 mb-3">

<label class="form-label">
Price
</label>


<input 
type="number"
name="price"
class="form-control"
required>


</div>






<div class="col-md-4 mb-3">

<label class="form-label">
Sale Price
</label>


<input 
type="number"
name="sale_price"
class="form-control">


</div>






<div class="col-md-4 mb-3">

<label class="form-label">
Stock
</label>


<input 
type="number"
name="stock"
class="form-control"
required>


</div>






<div class="col-md-4 mb-3">

<label class="form-label">
Material
</label>


<input 
type="text"
name="material"
class="form-control">


</div>






<div class="col-md-4 mb-3">

<label class="form-label">
Size
</label>


<input 
type="text"
name="size"
class="form-control">


</div>






<div class="col-md-4 mb-3">

<label class="form-label">
Color
</label>


<input 
type="text"
name="color"
class="form-control">


</div>






<div class="col-md-12 mb-3">

<label class="form-label">
Description
</label>


<textarea
name="description"
class="form-control"
rows="4"></textarea>


</div>


<div class="col-md-6">

<label class="form-label">
Product Image
</label>

<input 
type="file"
name="main_image"
class="form-control"
>

</div>






<div class="col-md-12 mb-4">


<label class="form-label">
Product Image
</label>


<input 
type="file"
name="main_image"
class="form-control">


</div>





</div>





<button class="btn btn-dark px-5">

Save Product

</button>



</form>


</div>


</div>


</div>

<script>


document.getElementById("category")
.addEventListener("change", function(){


let categoryId = this.value;



fetch(
`{% url 'dashboard:load_subcategories' %}?category_id=${categoryId}`
)


.then(response => response.json())


.then(data => {


let subcategory = 
document.getElementById("subcategory");



subcategory.innerHTML =
'<option value="">Select Sub Category</option>';



data.subcategories.forEach(function(item){


subcategory.innerHTML +=

`
<option value="${item.id}">
${item.name}
</option>
`;


});


});


});



</script>


{% endblock %}
