{% extends "dashboard/base_dashboard.html" %}


{% block title %}
Edit Product
{% endblock %}



{% block content %}


<div class="container-fluid">


<div class="card shadow border-0 rounded-4">


<div class="card-body p-4">


<h3 class="fw-bold mb-4">
Edit Product
</h3>



<form method="POST" enctype="multipart/form-data">


{% csrf_token %}



<div class="row g-3">



<div class="col-md-6">


<label class="form-label">
Product Name
</label>


<input 
type="text"
name="name"
class="form-control"
value="{{ product.name }}"
required>


</div>





<div class="col-md-6">


<label class="form-label">
SKU
</label>


<input 
type="text"
name="sku"
class="form-control"
value="{{ product.sku }}"
required>


</div>





<div class="col-md-6">


<label class="form-label">
Category
</label>



<select 
name="category"
id="category"
class="form-select"
required>


{% for category in categories %}


<option value="{{ category.id }}"
{% if product.category.id == category.id %}
selected
{% endif %}>


{{ category.name }}


</option>


{% endfor %}


</select>


</div>





<div class="col-md-6">


<label class="form-label">
Sub Category
</label>



<select 
name="subcategory"
id="subcategory"
class="form-select">



<option value="">
Select Sub Category
</option>



{% for sub in subcategories %}


<option value="{{ sub.id }}"
{% if product.subcategory.id == sub.id %}
selected
{% endif %}>


{{ sub.name }}


</option>


{% endfor %}



</select>


</div>






<div class="col-md-4">


<label class="form-label">
Price
</label>


<input 
type="number"
step="0.01"
name="price"
class="form-control"
value="{{ product.price }}">


</div>






<div class="col-md-4">


<label class="form-label">
Sale Price
</label>


<input 
type="number"
step="0.01"
name="sale_price"
class="form-control"
value="{{ product.sale_price }}">


</div>





<div class="col-md-4">


<label class="form-label">
Stock
</label>


<input 
type="number"
name="stock"
class="form-control"
value="{{ product.stock }}">


</div>






<div class="col-md-4">


<label class="form-label">
Material
</label>


<input 
type="text"
name="material"
class="form-control"
value="{{ product.material }}">


</div>






<div class="col-md-4">


<label class="form-label">
Size
</label>


<input 
type="text"
name="size"
class="form-control"
value="{{ product.size }}">


</div>





<div class="col-md-4">


<label class="form-label">
Color
</label>


<input 
type="text"
name="color"
class="form-control"
value="{{ product.color }}">


</div>







<div class="col-12">


<label class="form-label">
Description
</label>


<textarea
name="description"
class="form-control"
rows="4">


{{ product.description }}


</textarea>


</div>







<div class="col-md-6">


<label class="form-label">
Product Image
</label>



<input 
type="file"
name="main_image"
class="form-control">


</div>


<div class="col-md-3">

<label class="form-label">
New Product
</label>

<input 
type="checkbox"
name="is_new"
{% if product.is_new %}
checked
{% endif %}
>

</div>


<div class="col-md-3">

<label class="form-label">
On Sale
</label>

<input 
type="checkbox"
name="is_sale"
{% if product.is_sale %}
checked
{% endif %}
>

</div>


<div class="col-md-3">

<label class="form-label">
Featured
</label>

<input 
type="checkbox"
name="is_featured"
{% if product.is_featured %}
checked
{% endif %}
>

</div>


<div class="col-md-3">

<label class="form-label">
Best Seller
</label>

<input 
type="checkbox"
name="is_best_seller"
{% if product.is_best_seller %}
checked
{% endif %}
>

</div>




<div class="col-md-6">


{% if product.main_image %}


<img src="{{ product.main_image.url }}"
width="100"
class="rounded mt-3">


{% endif %}


</div>



</div>




<br>


<button class="btn btn-dark">

Update Product

</button>



<a href="{% url 'dashboard:products' %}"
class="btn btn-outline-dark">

Back

</a>



</form>


</div>


</div>


</div>





<script>


document.getElementById("category")
.addEventListener("change", function(){


let categoryId = this.value;



fetch(
`{% url 'dashboard:load_subcategories' %}?category_id=${categoryId}`
)


.then(response => response.json())


.then(data => {


let subcategory =
document.getElementById("subcategory");



subcategory.innerHTML =
'<option value="">Select Sub Category</option>';



data.subcategories.forEach(function(item){


subcategory.innerHTML +=

`
<option value="${item.id}">
${item.name}
</option>
`;



});


});


});


</script>



{% endblock %}
