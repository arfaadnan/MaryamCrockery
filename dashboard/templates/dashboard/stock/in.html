{% extends "dashboard/base_dashboard.html" %}



{% block title %}
Stock In
{% endblock %}




{% block content %}



<div class="container-fluid">



<div class="card shadow border-0 rounded-4">


<div class="card-body">


<h3 class="fw-bold mb-4">

Stock In - {{ product.name }}

</h3>




<form method="POST">


{% csrf_token %}



<div class="mb-3">


<label class="form-label">

Quantity

</label>


<input 
type="number"
name="quantity"
class="form-control"
required
>



</div>




<div class="mb-3">


<label class="form-label">

Note

</label>


<textarea
name="note"
class="form-control"
placeholder="Purchase / Supplier detail">

</textarea>


</div>





<button class="btn btn-dark">

Add Stock

</button>



</form>



</div>


</div>


</div>



{% endblock %}
