{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something Went Wrong</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .error-page{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:40px 20px;
        }
        .error-page h1{
            font-size:100px;
            font-weight:700;
            color:var(--accent, #A9682E);
            margin-bottom:10px;
        }
        .error-page h2{
            font-size:26px;
            margin-bottom:14px;
        }
        .error-page p{
            color:#777;
            margin-bottom:28px;
        }
        .error-page a{
            display:inline-block;
            padding:14px 32px;
            background:var(--ink, #161513);
            color:#fff;
            text-decoration:none;
            font-weight:600;
            letter-spacing:.5px;
            text-transform:uppercase;
            font-size:13px;
        }
        .error-page a:hover{
            background:var(--accent, #A9682E);
        }
    </style>
</head>
<body>

    <div class="error-page">
        <div>
            <h1>500</h1>
            <h2>Something Went Wrong</h2>
            <p>We're facing a technical issue right now. Please try again in a moment.</p>
            <a href="/">Back To Home</a>
        </div>
    </div>

</body>
</html>
