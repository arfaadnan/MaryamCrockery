<section class="offer-section">

    <div class="container">

        <div class="offer-wrapper">

            <div class="row align-items-center">

                <div class="col-lg-6">

                    <div class="section-header">

                        <h2>
                            LIMITED TIME OFFER
                        </h2>

                        <h3 class="offer-subtitle">
                            Premium Collection Sale
                        </h3>
                        <p>

                            Upgrade your dining experience with our elegant
                            ceramic and porcelain collections. Beautiful
                            designs, premium quality and affordable prices.

                        </p>

                        <a href="#" class="offer-btn">

                            Shop Collection

                            <i class="bi bi-arrow-right ms-2"></i>

                        </a>

                    </div>

                </div>

                <div class="col-lg-6">

                    <div class="offer-image">

                        {% if offers.first.image %}

                        <img src="{{ offers.first.image.url }}" alt="Offer">

                        {% else %}

                        <div class="offer-placeholder">

                            <i class="bi bi-gift"></i>

                        </div>

                        {% endif %}

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
