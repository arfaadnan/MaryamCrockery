<html>
<head>
<style>
    body { font-family: Arial, sans-serif; }
    .label-box { width: 320px; border: 2px dashed #000; padding: 15px; margin: 0 auto; }
    .store-title { font-size: 16px; font-weight: bold; text-align: center; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 10px; }
    .details { font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
    <div class="label-box">
        <div class="store-title">{{ settings.store_name }}</div>
        <div class="details">
            <p><strong>Order #:</strong> {{ order.order_number }}</p>
            <p><strong>Date:</strong> {{ order.created_at|date:"d/m/Y H:i" }}</p>
            <hr>
            <p><strong>SHIP TO:</strong><br>
            <span style="font-size: 15px; font-weight: bold;">{{ order.full_name }}</span><br>
            {{ order.address }}, {{ order.city }}</p>
            <p><strong>Phone:</strong> {{ order.phone }}</p>
            <hr>
            <p><strong>Payment:</strong> {{ order.get_payment_method_display }} (<strong>Rs. {{ order.total }}</strong>)</p>
        </div>
    </div>
</body>
</html>
